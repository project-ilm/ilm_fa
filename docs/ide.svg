<text x="868" y="118" text-anchor="end" direction="rtl" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">#شامل &lt;stdio.h&gt;</text>
<text x="868" y="139" text-anchor="end" direction="rtl" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">/* جستجوی دودویی در آرایهٔ مرتب */</text>
<text x="868" y="160" text-anchor="end" direction="rtl" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">صحیح جستجوی_دودویی(صحیح مقادیر[], صحیح شمار, صحیح کلید) {</text>
<text x="868" y="181" text-anchor="end" direction="rtl" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  صحیح کم = 0, بالا = شمار - 1;</text>
<text x="868" y="202" text-anchor="end" direction="rtl" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  وقتی (کم &lt;= بالا) {</text>
<text x="868" y="223" text-anchor="end" direction="rtl" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">    صحیح میانه = کم + (بالا - کم) / 2;</text>
<text x="868" y="244" text-anchor="end" direction="rtl" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">    اگر (مقادیر[میانه] == کلید) بازگشت میانه;</text>
<text x="868" y="265" text-anchor="end" direction="rtl" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">    اگر (مقادیر[میانه] &lt; کلید) کم = میانه + 1; وگرنه بالا = میانه - 1;</text>
<text x="868" y="286" text-anchor="end" direction="rtl" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  }</text>
<text x="868" y="307" text-anchor="end" direction="rtl" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  بازگشت -1;</text>
<text x="868" y="328" text-anchor="end" direction="rtl" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">}</text>
<text x="868" y="349" text-anchor="end" direction="rtl" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">صحیح اصلی(تهی) {</text>
</svg>